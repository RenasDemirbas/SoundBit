# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained (not a vulnerability). It is a build-time macro used by
    # gtk-rs 0.18, which Tauri needs on Linux; no maintained upgrade exists yet.
    { id = "RUSTSEC-2024-0370", reason = "transitive via Tauri's GTK stack; no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive licenses compatible with SoundBit's GPL-3.0-or-later. Extending this list needs
# review: GPL-2.0-only code, for example, cannot be combined with GPLv3.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

# MPL-2.0 is file-level copyleft and compatible with GPL-3.0-or-later when used unmodified.
# Allowed only for these crates pulled in by Tauri (Servo's CSS parser) and `dirs`, rather
# than globally.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
